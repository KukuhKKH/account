version: '3.8'

services:
  app:
    image: ${HUB}/${STACK_NAME}/${IMAGE_NAMESPACE}-app:${IMAGE_TAG:-latest}
    networks:
      - traefik-public

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 0s
        order: start-first
      placement:
        constraints: [ node.role == manager ]

      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${STACK_NAME}_app.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.${STACK_NAME}_app.entrypoints=websecure"
        - "traefik.http.routers.${STACK_NAME}_app.tls.certresolver=cloudflare"
        - "traefik.http.services.${STACK_NAME}_app.loadbalancer.server.port=80"

    environment:
      - SERVER_NAME=${DOMAIN}

networks:
  traefik-public:
    external: true
