server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Nonaktifkan absolute redirect agar redirect internal (seperti trailing slash) tetap HTTPS
    absolute_redirect off;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Service Worker & Web Manifest wajib no-cache agar browser & HP selalu update instan
    location ~* (sw\.js|sw-push-handler\.js|manifest\.webmanifest)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
    
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
