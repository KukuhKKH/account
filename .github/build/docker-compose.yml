version: '3.8'

services:
  app:
    image: ${HUB}/${STACK_NAME}/${IMAGE_NAMESPACE}-app:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: .github/build/Dockerfile
      args:
        HUB: ${HUB}
        IMAGE_NAMESPACE: ${IMAGE_NAMESPACE}
        STACK_NAME: ${STACK_NAME}
      platforms: [ "linux/amd64" ]
