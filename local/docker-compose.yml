services:
  backend:
    image: hyperf/hyperf:8.3-alpine-v3.19-swoole-v6
    container_name: identity-local-backend
    working_dir: /app
    volumes:
      - ../backend:/app
    ports:
      - "9501:9501"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=10.10.10.60
      - DB_PORT=3306
      - DB_DATABASE=identity
      - DB_USERNAME=webmaster
      - DB_PASSWORD=w3bmaster
      - REDIS_HOST=identity-local-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=null
      - LOGTO_ENDPOINT=http://identity-local-logto:3001
      - LOGTO_MANAGEMENT_API_RESOURCE=http://identity-local-logto:3001/api
    networks:
      - identity-net
    command: php artisan watch
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: identity-local-frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
    networks:
      - identity-net
    command: sh -c "corepack enable && pnpm dev --host 0.0.0.0"
    restart: unless-stopped

networks:
  identity-net:
    name: identity-local-net
    driver: bridge
