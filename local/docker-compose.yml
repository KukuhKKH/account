services:
  backend:
    image: hyperf/hyperf:8.4-alpine-v3.21-swoole-v6
    container_name: identity-local-backend
    working_dir: /app
    volumes:
      - ../backend:/app
    ports:
      - "9501:9501"
    env_file:
      - ../backend/.env
    networks:
      - identity-net
    command: php artisan watch
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: identity-local-frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"
    env_file:
      - ../frontend/.env
    networks:
      - identity-net
    command: sh -c "corepack enable && pnpm dev --host 0.0.0.0"
    restart: unless-stopped

networks:
  identity-net:
    name: identity-local-net
    driver: bridge
